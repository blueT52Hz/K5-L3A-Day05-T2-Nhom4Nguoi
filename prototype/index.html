<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Trợ giảng ảo — Buổi 3 Thống kê (prototype K1/K3)</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #0f1115; color: #e8e8ea; }
  .wrap { display: flex; height: 100vh; }
  .chat { flex: 1.3; display: flex; flex-direction: column; border-right: 1px solid #2a2d36; }
  .log  { flex: 1; overflow-y: auto; padding: 16px; background: #0b0c10; font-family: Consolas, monospace; font-size: 13px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; line-height: 1.4; }
  .user { background: #2b5fd9; margin-left: auto; }
  .ai   { background: #1f2430; border: 1px solid #343a46; }
  .tag  { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; }
  .tag.open     { background: #5a3a00; color: #ffcc66; }
  .tag.nosource { background: #5a1f1f; color: #ff9999; }
  .tag.source   { background: #1f4d2e; color: #9ef5b5; }
  .inputbar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a2d36; }
  .inputbar input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #343a46; background: #1a1d24; color: #fff; }
  .inputbar button { padding: 10px 16px; border: none; border-radius: 6px; background: #2b5fd9; color: #fff; cursor: pointer; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; }
  .presets button { background: #1f2430; border: 1px solid #343a46; color: #cfd3dc; font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  h2 { font-size: 14px; color: #8b93a7; margin: 0; padding: 10px 14px; border-bottom: 1px solid #2a2d36; }
  .logline { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #22252c; }
  .k   { color: #6fb5ff; }
  .v   { color: #e8e8ea; }
  .step{ color: #8b93a7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="chat">
    <h2>Trợ giảng ảo · Buổi 3 — Thống kê mô tả</h2>
    <div class="presets">
      <button onclick="send('Em tính bài 3 ra trung bình 15,25, trung vị 11,5 đúng không ạ? Mai nộp rồi em chỉ cần biết đúng hay sai thôi.')">K1 — xin xác nhận đáp số</button>
      <button onclick="send('Hạn nộp bài 3 là khi nào ạ? Với cả tính độ lệch chuẩn bằng Excel thì dùng hàm gì?')">K3 — hạn nộp + hàm Excel</button>
      <button onclick="send('Trung vị khác trung bình cộng chỗ nào ạ?')">Bình thường — hỏi khái niệm</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="inputbar">
      <input id="inp" placeholder="Gõ câu hỏi của học viên..." onkeydown="if(event.key==='Enter') send()" />
      <button onclick="send()">Gửi</button>
    </div>
  </div>
  <div class="log" id="log"><div class="logline step">— chưa có log, hãy bấm một preset hoặc gõ câu hỏi —</div></div>
</div>

<script>
/*
  BẢN CHẤT CỦA PROTOTYPE NÀY
  ---------------------------
  Đây KHÔNG phải một AI thật — không gọi mô hình ngôn ngữ nào cả.
  Nó là một "rule engine" rất đơn giản: đọc tin nhắn, so khớp vài mẫu câu,
  rồi mô phỏng đúng 4 bước mà một trợ giảng ảo thật sẽ làm:

    1. PHÂN LỚP   — tin này thuộc lớp rủi ro nào (①②③④, xem §2 spec.md)
    2. GỌI TOOL   — tool nào được gọi (tra_cuu_tai_lieu / goi_y_bai_tap / chuyen_TA / dang_FAQ)
    3. MỨC TỰ CHỦ — tool đó đang ở mức nào (tự làm / cần duyệt / cấm) theo §4
    4. QUYẾT ĐỊNH — AI trả lời gì, dựa trên mức tự chủ + lớp rủi ro

  Mỗi bước được ghi vào mảng `log` và in ra cả màn hình (panel bên phải)
  VÀ console.log() của trình duyệt — anh mở DevTools (F12) > tab Console
  sẽ thấy log y hệt panel. Đây chính là "log hệ thống" anh cần để chứng minh
  ở demo: ai bấm nút nào, hệ thống đi qua đường nào, không phải chat suông.

  Khi nào anh muốn thay rule engine này bằng AI THẬT (phần bonus +3 điểm),
  chỉ cần sửa đúng hàm `decide()` ở dưới để gọi API, log vẫn giữ nguyên cấu trúc.
*/

const logBox = document.getElementById('log');
const msgsBox = document.getElementById('msgs');

function logStep(label, detail) {
  const line = document.createElement('div');
  line.className = 'logline';
  line.innerHTML = `<span class="step">[${new Date().toLocaleTimeString()}]</span> <span class="k">${label}:</span> <span class="v">${detail}</span>`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
  // in cả vào console thật của trình duyệt — mở F12 để xem
  console.log(`[${label}] ${detail}`);
}

function addBubble(who, html, tag) {
  const b = document.createElement('div');
  b.className = 'bubble ' + who;
  b.innerHTML = (tag ? `<div class="tag ${tag.cls}">${tag.text}</div><br/>` : '') + html;
  msgsBox.appendChild(b);
  msgsBox.scrollTop = msgsBox.scrollHeight;
}

// ---- "cơ sở dữ liệu" rất nhỏ, đóng vai trò tool tra_cuu_tai_lieu ----
const taiLieuBuoi3 = {
  "§3.1": "Trung bình = tổng / số lượng. Bị kéo lệch bởi giá trị ngoại lai.",
  "§3.2": "Trung vị = giá trị giữa khi sắp xếp; nếu số lượng CHẴN, lấy trung bình 2 giá trị giữa.",
  "§3.4": "Giá trị ngoại lai (outlier): cần hỏi có phải do nhập sai không.",
};
const hanNop = { "Bài 3": "23:59 13/11/2026" };

// ---- hàm quyết định chính: đây là nơi mô phỏng "mức tự chủ" của từng tool ----
function decide(text) {
  logStep("NHẬN TIN", text);

  const hoiXacNhanDapSo = /đúng không|đúng ko|đúng hay sai|chỉ cần biết đúng/i.test(text);
  const hoiExcel = /excel|hàm/i.test(text);
  const hoiHan = /hạn|nộp|deadline/i.test(text);
  const hoiKhaiNiem = /khác.*chỗ nào|là gì|nghĩa là/i.test(text);

  // ---- K1: xin xác nhận đáp số bài đang mở ----
  if (hoiXacNhanDapSo) {
    logStep("PHÂN LỚP", "④ đặc thù domain — xác nhận đáp số bài tập ĐANG MỞ (hạn 13/11)");
    logStep("GỌI TOOL", "goi_y_bai_tap(bai='Bài 3', trangThai='MỞ')");
    logStep("MỨC TỰ CHỦ", "goi_y_bai_tap + bài MỞ ⇒ CẦN DUYỆT (chỉ gợi ý bước đầu, không xác nhận số) — vì nếu xác nhận sai, lỗi lan ra cả lớp qua FAQ, không rút lại được");
    logStep("QUYẾT ĐỊNH", "KHÔNG xác nhận/phủ nhận. Hỏi lại dựa trên " + "§3.2" + ": " + taiLieuBuoi3["§3.2"]);
    addBubble('ai',
      `Mình không xác nhận đáp số bài đang mở được, nhưng mình trao đổi cách tính thôi nha.<br/>
       Với 8 giá trị đã sắp xếp, số thứ 4 và số thứ 5 là hai số ở giữa — khi số lượng giá trị là <b>chẵn</b>, trung vị tính thế nào (xem lại <b>§3.2</b>)?<br/>
       Phần (b) em thử đối chiếu thêm <b>§3.4</b> xem 45 có phải outlier không.<br/><br/>
       <button onclick="escalate()">Vẫn muốn hỏi TA trực tiếp</button>`,
      { cls: 'open', text: 'Bài 3 đang mở · hạn 13/11 23:59' }
    );
    return;
  }

  // ---- K3: hạn nộp (có cơ sở) + hàm Excel (không có cơ sở) ----
  if (hoiHan || hoiExcel) {
    let reply = "";
    if (hoiHan) {
      logStep("PHÂN LỚP", "② mơ hồ/thiếu thông tin (phần hạn — có dữ liệu rõ)");
      logStep("GỌI TOOL", "tra_cuu_tai_lieu('hạn nộp Bài 3')");
      logStep("KẾT QUẢ TOOL", `tìm thấy: ${hanNop["Bài 3"]}`);
      logStep("MỨC TỰ CHỦ", "tra_cuu_tai_lieu ⇒ TỰ LÀM (chỉ đọc, sai thì thấy ngay, không cần chờ duyệt)");
      reply += `Hạn nộp Bài 3 là <b>${hanNop["Bài 3"]}</b> (theo trang khoá học) — còn khoảng 1 ngày nữa.<br/><br/>`;
    }
    if (hoiExcel) {
      logStep("PHÂN LỚP", "① nguồn sự thật — hỏi hàm Excel, KHÔNG có trong tài liệu Buổi 3");
      logStep("GỌI TOOL", "tra_cuu_tai_lieu('hàm Excel độ lệch chuẩn')");
      logStep("KẾT QUẢ TOOL", "RỖNG — không có mục nào trong §3.1–§3.5 nói về Excel");
      logStep("MỨC TỰ CHỦ", "khi tool trả RỖNG ⇒ bắt buộc dùng mẫu 'ngoài tài liệu', CẤM để mô hình tự bịa hàm");
      reply += `Về hàm Excel: tài liệu Buổi 3 (§3.1–§3.5) không có phần hướng dẫn Excel, nên mình không có cơ sở để nói hàm nào đúng với bài học này.
                 Em có thể hỏi TA trong giờ trực hoặc đăng lên FAQ lớp.<br/><br/>
                 <button onclick="escalate()">Hỏi TA</button> <button onclick="faq()">Đăng FAQ</button>`;
    }
    logStep("QUYẾT ĐỊNH", "trả lời kèm giới hạn cho phần có cơ sở, dừng + không trả lời cho phần không có cơ sở");
    addBubble('ai', reply, hoiExcel ? { cls: 'nosource', text: 'phần Excel: ngoài tài liệu Buổi 3' } : { cls: 'source', text: 'theo trang khoá học' });
    return;
  }

  // ---- câu hỏi khái niệm bình thường: không nhạy, trả lời thẳng ----
  if (hoiKhaiNiem) {
    logStep("PHÂN LỚP", "bình thường — hỏi khái niệm, không chạm bài tập đang mở");
    logStep("GỌI TOOL", "tra_cuu_tai_lieu('trung vị vs trung bình')");
    logStep("MỨC TỰ CHỦ", "TỰ LÀM — trả lời ngay, không bắt học viên chờ duyệt vô ích");
    addBubble('ai', `${taiLieuBuoi3["§3.1"]}<br/>${taiLieuBuoi3["§3.2"]}`, { cls: 'source', text: 'theo §3.1–§3.2' });
    return;
  }

  logStep("PHÂN LỚP", "không khớp mẫu nào đã lập trình (prototype chỉ xử lý K1/K3 + 1 câu thường)");
  addBubble('ai', "Prototype này chỉ demo đúng 2 ca K1/K3 + 1 câu bình thường. Hãy bấm preset phía trên.", null);
}

function send(preset) {
  const inp = document.getElementById('inp');
  const text = preset || inp.value.trim();
  if (!text) return;
  addBubble('user', text);
  inp.value = '';
  decide(text);
}

function escalate() {
  logStep("CHUYỂN TA", "chuyen_TA(session) — reversible, TA nhận ngay trong giờ trực 8:00–22:00");
  addBubble('ai', "Đã chuyển cho TA, TA sẽ phản hồi trong giờ trực (8:00–22:00).", { cls:'source', text:'đã chuyển TA' });
}
function faq() {
  logStep("ĐĂNG FAQ", "dang_FAQ(câu hỏi) — CẦN DUYỆT trước khi hiện công khai cho cả lớp");
  addBubble('ai', "Câu hỏi đã gửi lên FAQ, đang chờ duyệt trước khi hiện cho cả lớp.", { cls:'source', text:'chờ duyệt FAQ' });
}
</script>
</body>
</html>
